name: medshelf
description: MedShelf - Smart Medication Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  provider: ^6.1.2
  go_router: ^14.2.7
  image_picker: ^1.1.2
  http: ^1.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  geolocator: ^13.0.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
